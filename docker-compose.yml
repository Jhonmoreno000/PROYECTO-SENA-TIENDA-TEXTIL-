services:
  db:
    image: postgres:17
    container_name: ddtextil-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda_digital_textiles_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    volumes:
      - "./BASE DE DATOS/01_esquema_espanol.sql:/docker-entrypoint-initdb.d/01_esquema_espanol.sql:ro"
      - "./BASE DE DATOS/02_datos_iniciales.sql:/docker-entrypoint-initdb.d/02_datos_iniciales.sql:ro"
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tienda_digital_textiles_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ddtextil-backend:latest
    build:
      context: ./tienda digital de telas/backend-java/servidor-api
      dockerfile: Dockerfile
    container_name: ddtextil-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de Docker la base de datos siempre es el servicio "db" (no localhost).
      # Por eso no se lee DB_URL del .env, que apunta a localhost para desarrollo local.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tienda_digital_textiles_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      # Puerto interno fijo: el mapeo de puertos y el healthcheck usan 8081.
      # Para exponerlo en otro puerto del host cambia solo BACKEND_PORT.
      PORT: 8081
      # Las llaves de Wompi (WOMPI_PUBLIC_KEY, WOMPI_PRIVATE_KEY, WOMPI_INTEGRITY_SECRET,
      # WOMPI_EVENTS_SECRET) se leen solo del archivo .env (env_file); no se dejan valores por defecto aqui.
      WOMPI_ENV: ${WOMPI_ENV:-sandbox}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
      - "${WS_PORT:-8082}:8082"
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./tienda digital de telas/backend-java/servidor-api/uploads:/app/uploads"

  frontend:
    image: ddtextil-frontend:latest
    build:
      context: ./tienda digital de telas
      dockerfile: Dockerfile
    container_name: ddtextil-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    driver: local

networks:
  backend-net:
    driver: bridge
    internal: false
  frontend-net:
    driver: bridge
