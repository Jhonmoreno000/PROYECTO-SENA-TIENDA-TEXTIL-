# Cabeceras de seguridad comunes (OWASP).
# Se incluyen en el server y en cada location que define su propio add_header,
# porque nginx NO hereda los add_header del server en esas locations.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.wompi.co https://accounts.google.com https://login.microsoftonline.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:8081 http://localhost:3001 https://production.wompi.co https://sandbox.wompi.co https://accounts.google.com https://login.microsoftonline.com; frame-src https://checkout.wompi.co https://accounts.google.com https://login.microsoftonline.com;" always;
