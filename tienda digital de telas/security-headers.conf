# Cabeceras de seguridad comunes (OWASP).
# Se incluyen en el server y en cada location que define su propio add_header,
# porque nginx NO hereda los add_header del server en esas locations.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Unica Content-Security-Policy del sitio (antes habia otra en index.html y el navegador aplicaba ambas).
# connect-src: perfil SSO (googleapis / graph.microsoft) y Wompi. frame-src: mapa de Contacto y widget de Wompi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.wompi.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://checkout.wompi.co; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.googleapis.com https://graph.microsoft.com https://checkout.wompi.co https://sandbox.wompi.co https://production.wompi.co https://api.wompi.co; frame-src https://maps.google.com https://www.google.com https://checkout.wompi.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
