name: CI/CD Pipeline - Tienda Textil SENA

on:
  push:
    branches: [ "main", "master", "desarrollo" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-frontend:
    name: 📦 Construir Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Compilar Frontend (Vite)
        run: npm run build

  build-backend:
    name: ☕ Construir Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar compilación Java
        run: |
          cd backend-java/conexionPostgres
          mkdir -p bin
          find src -name "*.java" > sources.txt
          javac -d bin -cp "lib/*" @sources.txt

  docker-compose-test:
    name: 🐳 Prueba de Docker Compose
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Construir y Validar Contenedores (Dry Run)
        run: |
          # Solo construimos las imágenes para asegurarnos de que los Dockerfiles están correctos
          docker-compose build
