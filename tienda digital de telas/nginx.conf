server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresion gzip para aceleracion de transferencia del frontend
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cabeceras de ciberseguridad OWASP y politicas de navegacion (ver security-headers.conf)
    include /etc/nginx/snippets/security-headers.conf;

    # Resolver DNS interno de Docker (evita fallos de arranque si el backend tarda en iniciar)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_cluster http://backend:8081;

    # Cache inmutable para activos estaticos empaquetados
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Evitar cache de index.html para garantizar despliegue inmediato de nuevas versiones
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ hace que estas rutas ganen sobre la location regex de imagenes de arriba;
    # sin el, /uploads/foto.jpg se buscaba en el contenedor del frontend y daba 404.
    location ^~ /api/ {
        proxy_pass $backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /uploads/ {
        proxy_pass $backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
