<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ddBg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="52%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ddShine" x1="20" y1="10" x2="90" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ddGold" x1="24" y1="86" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>

  <!-- Escudo redondeado marca D&D Textil -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#ddBg)" />
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#ddShine)" />

  <!-- Pespunte textil perimetral artesanal -->
  <rect
    x="13"
    y="13"
    width="102"
    height="102"
    rx="24"
    stroke="#FFF7ED"
    stroke-opacity="0.45"
    stroke-width="2.2"
    stroke-dasharray="6 5"
  />

  <!-- Hebras de tela entrelazadas superiores -->
  <path
    d="M24 30C44 22 84 22 104 30"
    stroke="url(#ddGold)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Monograma principal D&D de alta legibilidad en pestañas de navegador -->
  <text
    x="64"
    y="75"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Outfit, Inter, system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="44"
    letter-spacing="-1.5"
  >
    D&amp;D
  </text>

  <!-- Onda textil inferior y aguja/hilo dorado -->
  <path
    d="M24 92C42 100 86 100 104 92"
    stroke="url(#ddGold)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <text
    x="64"
    y="108"
    text-anchor="middle"
    fill="#FFFBEB"
    font-family="Inter, system-ui, sans-serif"
    font-weight="800"
    font-size="13"
    letter-spacing="4"
  >
    TEXTIL
  </text>
</svg>
