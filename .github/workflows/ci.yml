name: CI/CD Pipeline - Tienda Textil SENA

on:
  push:
    branches: [ "main", "master", "feature/**", "feat/**", "fix/**", "docs/**", "desarrollo" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-frontend:
    name: Construir y Probar Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tienda digital de telas/package-lock.json'

      - name: Instalar dependencias
        run: |
          cd "tienda digital de telas"
          npm ci

      - name: Verificar estilo y reglas de ESLint
        run: |
          cd "tienda digital de telas"
          npm run lint

      - name: Auditoria de seguridad de dependencias (DevSecOps)
        run: |
          cd "tienda digital de telas"
          npm audit --audit-level=critical || true

      - name: Ejecutar Pruebas Automatizadas del Frontend
        run: |
          cd "tienda digital de telas"
          npm test

      - name: Compilar Frontend (Vite)
        run: |
          cd "tienda digital de telas"
          npm run build

  build-backend:
    name: Construir y Probar Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verificar compilacion Java
        run: |
          cd "tienda digital de telas/backend-java/servidor-api"
          mkdir -p bin
          find src -name "*.java" > sources.txt
          javac -d bin -cp "lib/*" @sources.txt

      - name: Ejecutar Suites de Pruebas Automatizadas (SENA ADSO)
        run: |
          cd "tienda digital de telas/backend-java/servidor-api"
          java -cp "bin:lib/*" PruebasReglasNegocioTextil
          java -cp "bin:lib/*" PruebasSeguridadIntegridad
          java -cp "bin:lib/*" PruebasConcurrenciaYPagos
          java -cp "bin:lib/*" PruebasContratoApi
          java -cp "bin:lib/*" PruebasWebSocket

  docker-compose-test:
    name: Prueba de Docker Compose
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar archivo .env para prueba
        run: cp .env.example .env

      - name: Validar archivo docker-compose
        run: |
          docker compose config

      - name: Compilar imagenes Docker de Frontend y Backend
        run: |
          docker compose build
