openapi: 3.0.3
info:
  title: API REST - D&D Textil
  version: 3.0.0
  description: 'Contrato de la API del backend Java 21 (`HttpServer`, puerto 8081). Cada ruta en español tiene un alias en inglés (`/api/productos` y `/api/products`). `ManejadorBase` aplica CORS, límite
    de 1200 peticiones por minuto por IP y de 5 MB por cuerpo. El servidor WebSocket (puerto 8082) emite NUEVO_PEDIDO, PEDIDO_ACTUALIZADO, STOCK_ACTUALIZADO, NUEVO_PRODUCTO, OFERTA_ACTUALIZADA y NOTIFICACION.


    Los pagos son simulados: ningún medio se conecta a una pasarela real. Solo los manejadores de usuarios, productos, pedidos y cupones validan el token; en las demás rutas se indica en la descripción.


    Generado el 17/11/2026 a partir del código de la rama `main`.'
  contact:
    name: Equipo D&D Textil - SENA ADSO
servers:
- url: http://localhost:8081
  description: Desarrollo local
- url: http://backend:8081
  description: Red interna de Docker Compose
tags:
- name: Autenticación
- name: Usuarios
- name: Productos
- name: Pedidos
- name: Pagos
- name: Carrito
- name: Cupones
- name: Facturas
- name: Reseñas
- name: Soporte
- name: Inventario
- name: Analítica
- name: Contenido
- name: Salud
paths:
  /api/iniciar-sesion:
    post:
      summary: Iniciar sesión
      tags:
      - Autenticación
      description: 'Alias: `/api/login`. Verifica la contraseña (PBKDF2; SHA-256 para cuentas antiguas) y devuelve el usuario con un token firmado (HMAC-SHA256, 12 horas). Tras 5 intentos fallidos bloquea
        el correo o la IP durante 15 minutos.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password: &id001
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPerfil'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas peticiones o cuenta bloqueada temporalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/registro:
    post:
      summary: Registrar cliente
      tags:
      - Autenticación
      description: 'Alias: `/api/register`. Crea una cuenta con rol `cliente`. Exige `aceptaHabeasData = true` (Ley 1581 de 2012) y contraseña de 8 o más caracteres.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id001
                email:
                  type: string
                  format: email
                password: *id001
                aceptaHabeasData: &id002
                  type: boolean
              required:
              - name
              - email
              - password
              - aceptaHabeasData
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
                  message: *id001
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/autenticacion/sso:
    post:
      summary: Iniciar sesión con Google o Microsoft
      tags:
      - Autenticación
      description: 'Alias: `/api/sso`. El backend valida el token con el proveedor y crea la cuenta si no existe.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - google
                  - microsoft
                token: *id001
              required:
              - provider
              - token
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPerfil'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/usuarios:
    get:
      summary: Listar usuarios
      tags:
      - Usuarios
      description: 'Solo administrador. Alias: `/api/users`.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/usuarios/{id}:
    get:
      summary: Consultar usuario
      tags:
      - Usuarios
      description: El propio usuario o el administrador.
      parameters: &id003
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
    put:
      summary: Actualizar usuario
      tags:
      - Usuarios
      description: El propio usuario edita su perfil. Rol, comisión, suspensión y activación solo el administrador.
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id001
                email: *id001
                phone: *id001
                role: *id001
                active: *id002
                suspended: *id002
                suspensionReason: *id001
                commissionRate: &id005
                  type: number
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
    delete:
      summary: Eliminar usuario
      tags:
      - Usuarios
      description: Solo administrador.
      parameters: *id003
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/usuarios/{id}/direcciones:
    get:
      summary: Listar direcciones
      tags:
      - Usuarios
      description: El propio usuario o el administrador.
      parameters: *id003
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Direccion'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
    post:
      summary: Agregar dirección
      tags:
      - Usuarios
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Direccion'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direccion'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/productos:
    get:
      summary: Catálogo
      tags:
      - Productos
      description: 'Público. Devuelve los productos activos (sin paginación). Alias: `/api/products`.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
    post:
      summary: Publicar tela
      tags:
      - Productos
      description: Vendedor o administrador. El producto queda con `estado_moderacion = pending` si el cuerpo no indica otro estado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
                  id: &id004
                    type: integer
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/productos/pendientes:
    get:
      summary: Telas pendientes de moderación
      tags:
      - Productos
      description: Vendedor o administrador.
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/productos/{id}:
    get:
      summary: Detalle de una tela
      tags:
      - Productos
      parameters: *id003
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Editar tela
      tags:
      - Productos
      description: 'Vendedor dueño o administrador. Marcar ofertas: solo administrador. Emite `STOCK_ACTUALIZADO` u `OFERTA_ACTUALIZADA` por WebSocket.'
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
    delete:
      summary: Retirar tela
      tags:
      - Productos
      description: Borrado lógico (`activo = false`). Vendedor dueño o administrador.
      parameters: *id003
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/productos/{id}/imagen:
    put:
      summary: Subir imagen en Base64
      tags:
      - Productos
      description: Vendedor dueño o administrador.
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image: *id001
              required:
              - image
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
                  url: *id001
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/productos/{id}/moderar:
    put:
      summary: Aprobar o rechazar una tela
      tags:
      - Productos
      description: Solo administrador.
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - approved
                  - rejected
                reason: *id001
              required:
              - status
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/pedidos:
    get:
      summary: Listar pedidos
      tags:
      - Pedidos
      description: 'Filtrados por rol: el administrador ve todos, el vendedor los suyos (`vendedor_id`) y el cliente los propios (`usuario_id`). Alias: `/api/orders`.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
    post:
      summary: Crear pedido
      tags:
      - Pedidos
      description: 'No exige sesión: el cliente se toma de `userId` en el cuerpo. Rechaza datos de tarjeta (PAN/CVV). Si falta stock responde 500.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: *id004
                total: *id005
                subtotal: *id005
                tax: *id005
                shippingCost: *id005
                discount: *id005
                couponCode: *id001
                customerName: *id001
                customerEmail: *id001
                customerPhone: *id001
                customerDocument: *id001
                shippingAddress: *id001
                shippingCity: *id001
                shippingDepartment: *id001
                paymentMethod: *id001
                items:
                  type: array
                  items:
                    type: object
              required:
              - userId
              - items
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
                  orderId: *id004
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pedidos/{id}:
    get:
      summary: Detalle de un pedido
      tags:
      - Pedidos
      description: Solo el cliente dueño, el vendedor del pedido o el administrador.
      parameters: *id003
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
    put:
      summary: Actualizar estado, guía o notas
      tags:
      - Pedidos
      description: Vendedor o administrador. Emite `PEDIDO_ACTUALIZADO` por WebSocket.
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: *id001
                trackingNumber: *id001
                notes: *id001
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/pagos/configuracion:
    get:
      summary: Configuración pública de pagos
      tags:
      - Pagos
      description: 'Alias: `/api/pagos/config`.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: *id002
                  publicKey: *id001
                  currency: *id001
                  environment: *id001
  /api/pagos/estado:
    get:
      summary: Estado de un pago
      tags:
      - Pagos
      parameters:
      - name: referencia
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference: *id001
                  status: *id001
                  paymentStatus: *id001
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pagos/intencion:
    post:
      summary: Crear intención de pago
      tags:
      - Pagos
      description: 'No exige sesión. El backend recalcula el total con los precios de la base de datos, crea el pedido en `pending`, descuenta el stock con `SELECT ... FOR UPDATE` y devuelve la referencia
        firmada. Alias: `/api/pagos/intent`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: *id004
                couponCode: *id001
                customerInfo:
                  type: object
                  properties:
                    fullName: *id001
                    email: *id001
                    phone: *id001
                    address: *id001
                    city: *id001
                    state: *id001
                    notes: *id001
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: *id004
                      quantity: *id005
              required:
              - items
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
                  orderId: *id004
                  reference: *id001
                  amountInCents:
                    type: integer
                    format: int64
                  currency: *id001
                  integritySignature: *id001
                  publicKey: *id001
                  subtotal: *id005
                  discount: *id005
                  shipping: *id005
                  tax: *id005
                  total: *id005
                  customerInfo:
                    type: object
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pagos/confirmar:
    post:
      summary: Confirmar pago (simulado)
      tags:
      - Pagos
      description: 'El backend acepta el `estadoPago` que envía el navegador; no verifica la transacción con la pasarela. Alias: `/api/pagos/confirm`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                referencia: *id001
                transaccionId: *id001
                metodoPago: *id001
                estadoPago:
                  type: string
                  example: APPROVED
              required:
              - referencia
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
                  reference: *id001
                  status: *id001
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pagos/webhook:
    post:
      summary: Webhook de Wompi
      tags:
      - Pagos
      description: 'Verifica la firma del evento y guarda el evento en `eventos_pago_wompi` (idempotencia). Alias: `/api/pagos/wompi-webhook`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: *id002
        '400':
