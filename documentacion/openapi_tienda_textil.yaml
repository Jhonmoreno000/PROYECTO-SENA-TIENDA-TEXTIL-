components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: TokenSesion (HMAC-SHA256)
      description: Token firmado por el servidor, válido 12 horas. En cada petición protegida el backend vuelve a leer el rol y el estado del usuario.
  schemas:
    Error:
      type: object
      properties:
        error: *id001
        message: *id001
    UsuarioPerfil:
      type: object
      properties:
        id: *id004
        name: *id001
        email: *id001
        role:
          type: string
          enum:
          - cliente
          - vendedor
          - administrador
        status: *id001
        token:
          type: string
          description: Token firmado `<cargaBase64Url>.<firmaBase64Url>`, válido 12 horas.
    Usuario:
      type: object
      description: Modelo `dominio.modelos.Usuario` (nombres JSON de `@SerializedName`).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        active:
          type: boolean
        suspended:
          type: boolean
        suspensionReason:
          type: string
        commissionRate:
          type: number
        registeredAt:
          type: string
        lastLogin:
          type: string
        status:
          type: string
    Direccion:
      type: object
      properties:
        id: *id004
        label: *id001
        recipientName: *id001
        phone: *id001
        address: *id001
